<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚦</text></svg>">
    <title>Smart Traffic Signal Optimization</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            color: #eee;
        }

        header {
            text-align: center;
            padding: 24px 16px 10px;
        }

        header h1 {
            font-size: clamp(18px, 4vw, 28px);
            font-weight: 700;
            color: #fff;
            letter-spacing: 1px;
        }

        header p {
            font-size: 13px;
            color: #aaa;
            margin-top: 4px;
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 16px;
        }

        .stat-card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 10px 20px;
            text-align: center;
            min-width: 100px;
        }

        .stat-card .label {
            font-size: 11px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .stat-card.active-card .value { color: #4ade80; }
        .stat-card.waiting-card .value { color: #facc15; }
        .stat-card.treated-card .value { color: #60a5fa; }
        .stat-card.cycle-card .value { color: #f472b6; }

        /* Intersection */
        .intersection-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .intersection {
            position: relative;
            width: min(480px, 95vw);
            height: min(480px, 95vw);
        }

        /* Roads */
        .road-h, .road-v {
            position: absolute;
            background: #2a2a2a;
        }

        .road-h {
            top: 50%; left: 0;
            width: 100%; height: 22%;
            transform: translateY(-50%);
        }

        .road-v {
            left: 50%; top: 0;
            height: 100%; width: 22%;
            transform: translateX(-50%);
        }

        /* Road lines */
        .road-h::before, .road-v::before {
            content: '';
            position: absolute;
            background: repeating-linear-gradient(
                90deg,
                #facc15 0px, #facc15 20px,
                transparent 20px, transparent 40px
            );
            top: 50%; left: 0;
            width: 100%; height: 3px;
            transform: translateY(-50%);
        }

        .road-v::before {
            background: repeating-linear-gradient(
                180deg,
                #facc15 0px, #facc15 20px,
                transparent 20px, transparent 40px
            );
            left: 50%; top: 0;
            height: 100%; width: 3px;
            transform: translateX(-50%);
        }

        /* Center box */
        .center-box {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 22%; height: 22%;
            background: #333;
            z-index: 2;
            border-radius: 4px;
        }

        /* Traffic light poles */
        .signal {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .signal.north { top: 4%; left: 50%; transform: translateX(-50%); }
        .signal.south { bottom: 4%; left: 50%; transform: translateX(-50%); }
        .signal.east  { right: 4%; top: 50%; transform: translateY(-50%); }
        .signal.west  { left: 4%; top: 50%; transform: translateY(-50%); }

        .signal-box {
            background: #111;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            align-items: center;
        }

        .signal.east .signal-box,
        .signal.west .signal-box {
            flex-direction: row;
        }

        .bulb {
            width: clamp(14px, 3.5vw, 22px);
            height: clamp(14px, 3.5vw, 22px);
            border-radius: 50%;
            background: #333;
            transition: background 0.3s, box-shadow 0.3s;
        }

        .bulb.red.on    { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .bulb.yellow.on { background: #facc15; box-shadow: 0 0 10px #facc15; }
        .bulb.green.on  { background: #4ade80; box-shadow: 0 0 10px #4ade80; }

        .signal-label {
            font-size: 11px;
            font-weight: 600;
            color: #ccc;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
            padding: 2px 6px;
        }

        /* Timer ring */
        .timer-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            text-align: center;
        }

        .timer-ring svg { display: block; }

        .timer-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(14px, 3vw, 20px);
            font-weight: 700;
            color: #fff;
        }

        /* Cars */
        .car {
            position: absolute;
            width: clamp(10px, 2.5vw, 16px);
            height: clamp(16px, 4vw, 26px);
            border-radius: 4px;
            z-index: 8;
            transition: transform 0.5s ease;
        }

        .car.north-car { background: #60a5fa; }
        .car.south-car { background: #f472b6; }
        .car.east-car  { background: #fb923c; width: clamp(16px,4vw,26px); height: clamp(10px,2.5vw,16px); }
        .car.west-car  { background: #a78bfa; width: clamp(16px,4vw,26px); height: clamp(10px,2.5vw,16px); }

        /* Queue bars */
        .queue-panel {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 16px;
        }

        .queue-lane {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 14px;
            min-width: 110px;
            text-align: center;
        }

        .queue-lane .lane-name {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bar-bg {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            height: 8px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .queue-count {
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
            color: #fff;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px 16px 24px;
        }

        .btn {
            padding: 10px 22px;
            border: none;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-start  { background: #4ade80; color: #111; }
        .btn-pause  { background: #facc15; color: #111; }
        .btn-reset  { background: #f87171; color: #111; }
        .btn-add    { background: #60a5fa; color: #111; }

        .btn:hover { opacity: 0.85; transform: scale(0.98); }

        /* Active signal highlight */
        .signal.active-signal .signal-box {
            border-color: #4ade80;
            box-shadow: 0 0 12px rgba(74,222,128,0.4);
        }

        /* Algorithm info */
        .algo-info {
            text-align: center;
            font-size: 12px;
            color: #888;
            padding: 0 16px 12px;
        }

        .algo-info span {
            color: #4ade80;
            font-weight: 600;
        }
    </style>
</head>
<body>

<header>
    <h1>🚦 Smart Traffic Signal Optimization</h1>
    <p>Greedy Algorithm — highest queue gets green first</p>
</header>

<!-- Stats -->
<div class="stats-bar">
    <div class="stat-card active-card">
        <div class="label">Active Green</div>
        <div class="value" id="stat-active">N</div>
    </div>
    <div class="stat-card waiting-card">
        <div class="label">Total Waiting</div>
        <div class="value" id="stat-waiting">0</div>
    </div>
    <div class="stat-card treated-card">
        <div class="label">Cars Passed</div>
        <div class="value" id="stat-treated">0</div>
    </div>
    <div class="stat-card cycle-card">
        <div class="label">Cycle</div>
        <div class="value" id="stat-cycle">1</div>
    </div>
</div>

<!-- Intersection -->
<div class="intersection-wrapper">
    <div class="intersection" id="intersection">
        <div class="road-h"></div>
        <div class="road-v"></div>
        <div class="center-box"></div>

        <!-- North Signal -->
        <div class="signal north" id="sig-N">
            <div class="signal-box">
                <div class="bulb red" id="N-red"></div>
                <div class="bulb yellow" id="N-yellow"></div>
                <div class="bulb green" id="N-green"></div>
            </div>
            <div class="signal-label">North</div>
        </div>

        <!-- South Signal -->
        <div class="signal south" id="sig-S">
            <div class="signal-label">South</div>
            <div class="signal-box">
                <div class="bulb red" id="S-red"></div>
                <div class="bulb yellow" id="S-yellow"></div>
                <div class="bulb green" id="S-green"></div>
            </div>
        </div>

        <!-- East Signal -->
        <div class="signal east" id="sig-E">
            <div class="signal-box">
                <div class="bulb red" id="E-red"></div>
                <div class="bulb yellow" id="E-yellow"></div>
                <div class="bulb green" id="E-green"></div>
            </div>
            <div class="signal-label">East</div>
        </div>

        <!-- West Signal -->
        <div class="signal west" id="sig-W">
            <div class="signal-box">
                <div class="bulb red" id="W-red"></div>
                <div class="bulb yellow" id="W-yellow"></div>
                <div class="bulb green" id="W-green"></div>
            </div>
            <div class="signal-label">West</div>
        </div>

        <!-- Timer Ring -->
        <div class="timer-ring">
            <svg width="80" height="80" viewBox="0 0 80 80">
                <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
                <circle cx="40" cy="40" r="34" fill="none" stroke="#4ade80" stroke-width="6"
                    stroke-dasharray="213.6" stroke-dashoffset="0"
                    stroke-linecap="round"
                    transform="rotate(-90 40 40)"
                    id="timer-circle"/>
            </svg>
            <div class="timer-text" id="timer-text">--</div>
        </div>
    </div>
</div>

<!-- Queue Panel -->
<div class="queue-panel">
    <div class="queue-lane">
        <div class="lane-name">🔵 North</div>
        <div class="bar-bg"><div class="bar-fill" id="bar-N" style="width:0%;background:#60a5fa;"></div></div>
        <div class="queue-count" id="count-N">0 cars</div>
    </div>
    <div class="queue-lane">
        <div class="lane-name">🩷 South</div>
        <div class="bar-bg"><div class="bar-fill" id="bar-S" style="width:0%;background:#f472b6;"></div></div>
        <div class="queue-count" id="count-S">0 cars</div>
    </div>
    <div class="queue-lane">
        <div class="lane-name">🟠 East</div>
        <div class="bar-bg"><div class="bar-fill" id="bar-E" style="width:0%;background:#fb923c;"></div></div>
        <div class="queue-count" id="count-E">0 cars</div>
    </div>
    <div class="queue-lane">
        <div class="lane-name">🟣 West</div>
        <div class="bar-bg"><div class="bar-fill" id="bar-W" style="width:0%;background:#a78bfa;"></div></div>
        <div class="queue-count" id="count-W">0 cars</div>
    </div>
</div>

<div class="algo-info">
    Greedy picks: <span id="algo-reason">waiting for simulation...</span>
</div>

<!-- Controls -->
<div class="controls">
    <button class="btn btn-start" onclick="startSim()">▶ Start</button>
    <button class="btn btn-pause" onclick="pauseSim()">⏸ Pause</button>
    <button class="btn btn-add"   onclick="addRandomCars()">🚗 Add Cars</button>
    <button class="btn btn-reset" onclick="resetSim()">↺ Reset</button>
</div>

<script>
    const queues = { N: 3, S: 2, E: 5, W: 1 };
    const MAX_QUEUE = 10;
    let carsPassed = 0;
    let cycle = 1;
    let currentGreen = null;
    let greenTimer = 0;
    let greenDuration = 0;
    let simRunning = false;
    let intervalId = null;
    let tickCount = 0;
    const CIRCUMFERENCE = 2 * Math.PI * 34;

    function setSignal(dir, state) {
        ['N','S','E','W'].forEach(d => {
            document.getElementById(`${d}-red`).classList.remove('on');
            document.getElementById(`${d}-yellow`).classList.remove('on');
            document.getElementById(`${d}-green`).classList.remove('on');
            document.getElementById(`sig-${d}`).classList.remove('active-signal');
        });

        ['N','S','E','W'].forEach(d => {
            if (d === dir) {
                document.getElementById(`${d}-${state}`).classList.add('on');
                if (state === 'green') document.getElementById(`sig-${d}`).classList.add('active-signal');
            } else {
                document.getElementById(`${d}-red`).classList.add('on');
            }
        });
    }

    function greedyPick() {
        return Object.entries(queues).sort((a, b) => b[1] - a[1])[0][0];
    }

    function updateUI() {
        const total = Object.values(queues).reduce((a,b) => a+b, 0);
        document.getElementById('stat-waiting').textContent = total;
        document.getElementById('stat-treated').textContent = carsPassed;
        document.getElementById('stat-cycle').textContent = cycle;
        document.getElementById('stat-active').textContent = currentGreen || '--';

        ['N','S','E','W'].forEach(d => {
            const q = queues[d];
            const pct = Math.min((q / MAX_QUEUE) * 100, 100);
            document.getElementById(`bar-${d}`).style.width = pct + '%';
            document.getElementById(`count-${d}`).textContent = q + ' car' + (q !== 1 ? 's' : '');
        });
    }

    function updateTimer(remaining, total) {
        const pct = remaining / total;
        const offset = CIRCUMFERENCE * (1 - pct);
        document.getElementById('timer-circle').style.strokeDashoffset = offset;
        document.getElementById('timer-text').textContent = remaining;
    }

    function tick() {
        tickCount++;

        // Randomly add cars every 3 ticks
        if (tickCount % 3 === 0) {
            const dirs = ['N','S','E','W'];
            const rDir = dirs[Math.floor(Math.random() * 4)];
            if (queues[rDir] < MAX_QUEUE) queues[rDir]++;
        }

        if (greenTimer <= 0) {
            // Yellow phase
            if (currentGreen) {
                setSignal(currentGreen, 'yellow');
                setTimeout(() => {
                    // Pick next
                    const next = greedyPick();
                    currentGreen = next;
                    greenDuration = Math.max(3, Math.min(queues[next] * 2, 12));
                    greenTimer = greenDuration;
                    cycle++;

                    document.getElementById('algo-reason').textContent =
                        `${next} lane has most cars (${queues[next]}) → green for ${greenDuration}s`;

                    setSignal(next, 'green');
                }, 800);
            } else {
                const next = greedyPick();
                currentGreen = next;
                greenDuration = Math.max(3, Math.min(queues[next] * 2, 12));
                greenTimer = greenDuration;
                document.getElementById('algo-reason').textContent =
                    `${next} lane has most cars (${queues[next]}) → green for ${greenDuration}s`;
                setSignal(next, 'green');
            }
        } else {
            // Release 1 car per tick from green lane
            if (queues[currentGreen] > 0) {
                queues[currentGreen]--;
                carsPassed++;
            }
            greenTimer--;
            updateTimer(greenTimer, greenDuration);
        }

        updateUI();
    }

    function startSim() {
        if (simRunning) return;
        simRunning = true;
        intervalId = setInterval(tick, 1000);
    }

    function pauseSim() {
        simRunning = false;
        clearInterval(intervalId);
    }

    function addRandomCars() {
        ['N','S','E','W'].forEach(d => {
            const add = Math.floor(Math.random() * 4) + 1;
            queues[d] = Math.min(queues[d] + add, MAX_QUEUE);
        });
        updateUI();
    }

    function resetSim() {
        pauseSim();
        queues.N = 3; queues.S = 2; queues.E = 5; queues.W = 1;
        carsPassed = 0; cycle = 1; currentGreen = null;
        greenTimer = 0; tickCount = 0;
        document.getElementById('timer-text').textContent = '--';
        document.getElementById('timer-circle').style.strokeDashoffset = 0;
        document.getElementById('algo-reason').textContent = 'waiting for simulation...';
        document.getElementById('stat-active').textContent = '--';
        ['N','S','E','W'].forEach(d => {
            document.getElementById(`${d}-red`).classList.remove('on');
            document.getElementById(`${d}-yellow`).classList.remove('on');
            document.getElementById(`${d}-green`).classList.remove('on');
            document.getElementById(`sig-${d}`).classList.remove('active-signal');
        });
        updateUI();
    }

    updateUI();
</script>
</body>
</html>
